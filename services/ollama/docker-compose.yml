services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ../../runtime/ollama/data:/root/.ollama
      - ../../runtime/ollama/models:/models:ro
      # Symlinks in /models point at the real GGUF cache; mount it at the
      # same absolute path so they resolve inside the container.
      - /home/giografi/.cache/llmfit/models:/home/giografi/.cache/llmfit/models:ro

    # Auto-import any GGUF files dropped into runtime/ollama/models/ on start.
    # Each file becomes an ollama model named after its basename (e.g. Foo.gguf -> foo).
    # ponytail: startup loop, tolerates existing models; remove if it ever breaks on a quirky name
    entrypoint: /bin/sh
    command: >
      -c '
        ollama serve &
        SERVE_PID=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        for f in /models/*.gguf; do
          [ -e "$$f" ] || continue
          name=$$(basename "$$f" .gguf | tr "[:upper:]" "[:lower:]" | tr "." "-")
          printf "FROM /models/%s\n" "$$(basename "$$f")" > /tmp/Modelfile
          ollama create "$$name" -f /tmp/Modelfile || true
        done
        wait $$SERVE_PID
      '

    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - private-net

    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 12G
        reservations:
          cpus: "2"
          memory: 2G

networks:
  private-net:
    external: true
