services:
  syncthing:
    container_name: syncthing
    image: lscr.io/linuxserver/syncthing:latest
    restart: unless-stopped

    environment:
      PUID: 1000
      PGID: 1000
      TZ: Asia/Jakarta

    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"

    volumes:
      - ../../runtime/syncthing/config:/config
      - /home/giografi/syncthing:/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8384/rest/noauth/health || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 5
      start_period: 10s

    networks:
      - private-net

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

networks:
  private-net:
    external: true
