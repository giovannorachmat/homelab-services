services:
  playwright-service:
    container_name: firecrawl-playwright
    image: ghcr.io/firecrawl/playwright-service:latest
    restart: unless-stopped

    env_file:
      - ../../runtime/firecrawl/.env

    environment:
      PORT: 3000
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
      BLOCK_MEDIA: ${BLOCK_MEDIA}
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}

    networks:
      - backend

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 4G

    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  api:
    container_name: firecrawl-api
    image: ghcr.io/firecrawl/firecrawl
    restart: unless-stopped

    env_file:
      - ../../runtime/firecrawl/.env

    environment:
      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}
      EXTRACT_WORKER_PORT: ${EXTRACT_WORKER_PORT:-3004}
      WORKER_PORT: ${WORKER_PORT:-3005}
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      NUQ_DATABASE_URL: ${NUQ_DATABASE_URL:-postgres://postgres:postgres@nuq-postgres:5432/postgres}
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}
      ENV: local

    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

    ports:
      - "${PORT:-3002}:${INTERNAL_PORT:-3002}"

    volumes:
      - ../../runtime/firecrawl/data/fdb-cluster-file:/var/fdb:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    command: node dist/src/harness.js --start-docker

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "4"
          memory: 8G

    networks:
      - private-net
      - backend

  redis:
    container_name: firecrawl-redis
    # NOTE: If you want to use Valkey (open source) instead of Redis (source available),
    # uncomment the Valkey statement and comment out the Redis statement.
    # Using Valkey with Firecrawl is untested and not guaranteed to work. Use with caution.
    image: redis:alpine
    # image: valkey/valkey:alpine
    restart: unless-stopped

    networks:
      - backend

    command: redis-server --bind 0.0.0.0

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  rabbitmq:
    container_name: firecrawl-rabbitmq
    image: rabbitmq:3-management
    restart: unless-stopped

    networks:
      - backend

    command: rabbitmq-server

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  nuq-postgres:
    container_name: firecrawl-postgres
    image: ghcr.io/firecrawl/nuq-postgres:latest
    restart: unless-stopped

    env_file:
      - ../../runtime/firecrawl/.env

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

    networks:
      - backend

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # FoundationDB queue backend (experimental). Enable by setting
  # NUQ_BACKEND=fdb; the api container reads the shared cluster file from the
  # fdb-cluster-file volume. Replaces nuq-postgres once stable.
  foundationdb:
    container_name: firecrawl-foundationdb
    image: foundationdb/foundationdb:7.3.63
    restart: unless-stopped

    environment:
      FDB_NETWORKING_MODE: container
      FDB_COORDINATOR_PORT: 4500

    networks:
      - backend

    volumes:
      - ../../runtime/firecrawl/data/fdb-data:/var/fdb/data
      - ../../runtime/firecrawl/data/fdb-cluster-file:/var/fdb

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # one-shot: creates the database on first boot (no-op afterwards)
  foundationdb-init:
    container_name: firecrawl-fdb-init
    image: foundationdb/foundationdb:7.3.63
    restart: "no"

    depends_on:
      - foundationdb

    networks:
      - backend

    volumes:
      - ../../runtime/firecrawl/data/fdb-cluster-file:/var/fdb

    entrypoint:
      - /bin/bash
      - -c
      - "sleep 5 && out=$(fdbcli -C /var/fdb/fdb.cluster --exec 'configure new single ssd' 2>&1); status=$$?; printf '%s\n' \"$$out\"; if [ \"$$status\" -eq 0 ]; then exit 0; fi; printf '%s\n' \"$$out\" | grep -Eiq 'already.*configured|database.*configured'"

networks:
  private-net:
    external: true
  backend:
    driver: bridge
